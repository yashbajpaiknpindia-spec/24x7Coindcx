name: Paper engine regression checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  paper-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: python tests_paper_risk_controls.py
      - run: python tests_paper_decision_audit.py
