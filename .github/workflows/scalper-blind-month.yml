name: CoinDCX scalper one-month blind test

on:
  pull_request:
    branches: [main]
  push:
    branches: [scalper-blind-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-api-blind-test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependency
        run: python -m pip install requests==2.32.3
      - name: Fetch public CoinDCX 1m candles and run blind replay
        id: replay
        shell: bash
        run: |
          set +e
          python scripts/scalper_blind_month.py 2>&1 | tee blind_test_output/run.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload complete audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-scalper-blind-month
          path: blind_test_output/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish test decision
        if: always()
        run: |
          echo "Research script exit code: ${{ steps.replay.outputs.exit_code }}"
          if [ -f blind_test_output/REPORT.md ]; then cat blind_test_output/REPORT.md; else echo "No report produced; inspect run logs/artifact." ; fi
